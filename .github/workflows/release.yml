name: Release

# Builds every platform, signs the update manifests and uploads them with the
# installers to a DRAFT GitHub Release of the version in mygo.json (MyGo's
# GitHub Releases channel: apps read update-<os>-<arch>.json from
# releases/latest/download/ once the draft is published).
#
# Required signing and notarization secrets: see .github/RELEASING.md
# Installed apps reject unsigned updates; production macOS builds require
# Developer ID signing and successful Apple notarization before upload.

# Internal beta tags (v<version>-beta-<yyyymmddhhmmss>) never make a
# release: they are excluded here, and only ci.yml builds them (as
# artifacts, with updates disabled).
on:
  push:
    tags: ["v*", "!v*-beta-*"]
  workflow_dispatch:

permissions:
  contents: write # the draft release and its uploads

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the version and required signing secrets
        id: v
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          version="$(jq -r .version mygo.json)"
          tag="v$version"
          if [[ "$GITHUB_REF_NAME" == *-beta-* ]]; then
            echo "::error::$GITHUB_REF_NAME is an internal beta: betas are built by ci.yml only, never released."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mygo.json version $version (expected $tag)."
            exit 1
          fi
          for name in MYGO_UPDATER_PRIVATE_KEY MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret $name is not set; see .github/RELEASING.md"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ] || {
              echo "::error::Release $TAG is already published; refusing to replace its assets."
              exit 1
            }
            echo "Draft $TAG exists; its files are replaced after validation."
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --generate-notes
          else
            # workflow_dispatch: the tag is created at this commit when the draft is published.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi

  build:
    needs: draft-release
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }
          - { os: macos-latest, goos: darwin, goarch: arm64 }
          - { os: macos-latest, goos: darwin, goarch: amd64 }
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.draft-release.outputs.version }}
      TAG: ${{ needs.draft-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cache NSIS
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: nsis-${{ hashFiles('go.sum') }}
      - name: Prepare macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash .github/macos-release.sh prepare
      - name: Build and sign updates
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.goos }}/${{ matrix.goarch }}"
      - name: Check the manifest is signed
        run: |
          m="build/${{ matrix.goos }}-${{ matrix.goarch }}/update-${{ matrix.goos }}-${{ matrix.goarch }}.json"
          jq -e '.signature | length > 0' "$m" > /dev/null || { echo "::error::$m is not signed"; exit 1; }
      - name: Verify macOS signature and notarization tickets
        if: runner.os == 'macOS'
        run: bash .github/macos-release.sh verify "${{ matrix.goarch }}"
      - name: Package extras
        run: bash .github/package-extras.sh "${{ matrix.goos }}" "${{ matrix.goarch }}" "$VERSION"
      - name: Upload validated assets to the draft, manifests last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ] || {
            echo "::error::Release $TAG must remain a draft until all builds finish."
            exit 1
          }
          shopt -s nullglob
          dir="build/${{ matrix.goos }}-${{ matrix.goarch }}"
          files=("$dir"/*.tar.gz "$dir"/*.deb "$dir"/*.dmg "$dir"/*.zip "$dir"/*-setup-*.exe "$dir"/install.sh "$dir"/*.delta)
          # install.sh is a literal path when absent; Windows does not produce it.
          assets=()
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then assets+=("$file"); fi
          done
          [ "${#assets[@]}" -gt 0 ] || { echo "::error::No release assets found"; exit 1; }
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ] || {
            echo "::error::Release $TAG was published during upload; refusing to replace its update manifest."
            exit 1
          }
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$dir/update-${{ matrix.goos }}-${{ matrix.goarch }}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: sshyard-${{ env.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          path: |
            build/*/*.tar.gz
            build/*/*.deb
            build/*/*.dmg
            build/*/*.zip
            build/*/*-setup-*.exe
            build/*/install.sh
            build/*/update-*.json
            build/*/*.delta
      - name: Remove macOS signing credentials
        if: always() && runner.os == 'macOS'
        run: bash .github/macos-release.sh cleanup
